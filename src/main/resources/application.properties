quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/tasks
quarkus.datasource.username=sa
quarkus.datasource.password=sa

quarkus.hibernate-orm.database.generation=update
#BBDD para tests
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test

#Hace que Jackson rechace propiedades JSON que no existen en el DTO.
quarkus.jackson.fail-on-unknown-properties=true

#Datos para swagger UI
quarkus.smallrye-openapi.info-title=Quarkus Learning API (properties)
quarkus.smallrye-openapi.info-version=1.1
quarkus.smallrye-openapi.info-description=REST API for managing tasks
